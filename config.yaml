# ============================================================
# Конфигурация мониторинга сайтов
# Здесь настраиваются список сайтов, пороги и таймауты.
# Секреты (токен бота и chat_id) сюда НЕ добавляются —
# они хранятся в GitHub Secrets, см. README.md
# ============================================================

# Часовой пояс для отображения времени в сообщениях Telegram
timezone: "Europe/Moscow"

# Таймаут одного HTTP-запроса, секунд.
# Если сайт не ответил за это время — считается ошибкой "timeout"
request_timeout_seconds: 10

# Порог деградации: если сайт ответил, но медленнее этого значения (сек) —
# считаем это проблемой ("слишком медленный ответ")
slow_response_seconds: 5

# За сколько дней до истечения SSL-сертификата присылать предупреждение
ssl_expiry_warning_days: 14

# Сколько попыток сделать всего (включая первую), прежде чем считать сайт
# реально упавшим и слать тревогу. То есть при значении 3:
# 1-я попытка неудачна -> ждём retry_interval_seconds -> 2-я попытка ->
# если снова неудачно -> ждём ещё раз -> 3-я попытка -> если и она неудачна,
# только тогда шлём уведомление о падении.
retry_count: 3

# Интервал между повторными попытками внутри одного запуска, секунд
retry_interval_seconds: 15

# Максимальное количество строк в истории (history.csv), не считая заголовка.
# Когда лимит превышается, самые старые строки удаляются, чтобы файл
# не разрастался бесконечно. 20000 строк при проверке раз в 5 минут
# для 2 сайтов — это примерно 1.5 месяца истории.
max_history_rows: 20000

# ------------------------------------------------------------
# Список сайтов для мониторинга
# ------------------------------------------------------------
sites:
  - name: "ACTE"
    url: "https://acte.ru"
    # ВАЖНО: check_text — это контрольный текст, который должен быть на
    # главной странице сайта в норме. Он нужен, чтобы ловить ситуацию,
    # когда сервер отвечает HTTP 200, но фактически отдаёт страницу-заглушку,
    # страницу ошибки хостинга или "сайт временно недоступен".
    #
    # Из этой рабочей среды не удалось напрямую загрузить главную страницу
    # acte.ru, чтобы автоматически подставить точный текст (сеть песочницы
    # заблокировала запрос). Поэтому ниже — плейсхолдер, который нужно
    # заменить самостоятельно. Как это сделать за 1 минуту:
    #   1. Откройте https://acte.ru в браузере.
    #   2. Возьмите короткий кусок текста, который точно есть на главной
    #      странице и не изменится (например, часть названия компании,
    #      слоган, пункт меню, текст в футере — не берите дату/год).
    #   3. Вставьте этот текст сюда вместо плейсхолдера.
    # Если оставить пустую строку "" — проверка контрольного текста
    # просто отключится для этого сайта (без ошибок).
    check_text: "ТЕСТ_ПРОВЕРКА_ДОСТАВКИ_В_ГРУППУ_12345"

  - name: "Pantis"
    url: "https://pantis.com"
    # См. пояснение выше — замените на реальный текст с pantis.com
    check_text: "Pantis"
